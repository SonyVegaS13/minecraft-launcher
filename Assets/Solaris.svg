<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sun" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff7bd"/>
      <stop offset="0.28" stop-color="#ffd84a"/>
      <stop offset="0.7" stop-color="#ff9d16"/>
      <stop offset="1" stop-color="#ff6410"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Transparent outside the emblem: no square background in Windows shortcuts. -->
  <circle cx="256" cy="256" r="225" fill="#09071a" stroke="#ffb52a" stroke-width="8" filter="url(#glow)"/>
  <g fill="#ffc52e" opacity=".98" filter="url(#glow)">
    <path d="M256 35l18 61h-36z"/><path d="M256 477l-18-61h36z"/>
    <path d="M35 256l61-18v36z"/><path d="M477 256l-61 18v-36z"/>
    <path d="M101 101l51 37-26 26z"/><path d="M411 411l-51-37 26-26z"/>
    <path d="M411 101l-37 51-26-26z"/><path d="M101 411l37-51 26 26z"/>
  </g>
  <circle cx="256" cy="256" r="116" fill="url(#sun)" opacity=".99" filter="url(#glow)"/>
  <!-- Orbital ring matching the approved Solaris sun emblem, with no letter or text. -->
  <ellipse cx="256" cy="256" rx="190" ry="72" fill="none" stroke="#ffd34d" stroke-width="11" stroke-linecap="round" opacity=".95" transform="rotate(-24 256 256)" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="190" ry="72" fill="none" stroke="#fff0a0" stroke-width="3" stroke-linecap="round" opacity=".9" transform="rotate(-24 256 256)"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#ffb52a" stroke-width="7" opacity=".98"/>
</svg>

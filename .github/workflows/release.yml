name: Solaris Launcher Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v2.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.version }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Version must look like v1.0.0"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Restore launcher
        run: dotnet restore SolarisLauncher.csproj

      - name: Build launcher
        run: dotnet build SolarisLauncher.csproj -c Release --no-restore

      - name: Publish launcher
        shell: pwsh
        run: |
          if (Test-Path artifacts) { Remove-Item artifacts -Recurse -Force }
          New-Item -ItemType Directory -Path artifacts/publish | Out-Null
          dotnet publish SolarisLauncher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 `
            -p:FileVersion=${{ steps.version.outputs.version }}.0 `
            -o artifacts/publish
          if (-not (Test-Path artifacts/publish/SolarisLauncher.exe)) {
            throw 'SolarisLauncher.exe was not produced.'
          }

      - name: Publish updater
        shell: pwsh
        run: |
          dotnet publish SolarisUpdater/SolarisUpdater.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o artifacts/publish
          if (-not (Test-Path artifacts/publish/SolarisUpdater.exe)) {
            throw 'SolarisUpdater.exe was not produced.'
          }

      - name: Create release ZIP
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          Compress-Archive `
            -Path artifacts/publish/SolarisLauncher.exe, artifacts/publish/SolarisUpdater.exe `
            -DestinationPath "artifacts/SolarisLauncher-$tag-win-x64.zip" `
            -Force

      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          Get-FileHash artifacts/publish/SolarisLauncher.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  SolarisLauncher.exe" } |
            Set-Content artifacts/SHA256SUMS.txt
          Get-FileHash artifacts/publish/SolarisUpdater.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  SolarisUpdater.exe" } |
            Add-Content artifacts/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release create $tag `
            artifacts/publish/SolarisLauncher.exe `
            artifacts/publish/SolarisUpdater.exe `
            "artifacts/SolarisLauncher-$tag-win-x64.zip" `
            artifacts/SHA256SUMS.txt `
            --title "Solaris Launcher $tag" `
            --generate-notes

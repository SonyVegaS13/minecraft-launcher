name: Solaris Launcher Release

on:
  push:
    branches:
      - 'solaris-2.2-dev'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v2.1.3'
        required: true
        type: string

permissions:
  contents: write

# Prevent intermediate development commits from publishing over a later build.
concurrency:
  group: solaris-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } else {
            [xml]$project = Get-Content SolarisLauncher.csproj
            $tag = "v$($project.Project.PropertyGroup.Version)"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Version must look like v1.0.0'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Install image support for approved Solaris icon
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate official Windows icon and launcher logo
        run: python scripts/generate_icon.py

      - name: Prepare bundled Solaris Neon artwork
        shell: pwsh
        run: |
          if (Test-Path Assets/Solaris-Neon-UI.zip) {
            python scripts/prepare_neon_art.py
            if ($LASTEXITCODE -ne 0) { throw 'Approved Solaris Neon art verification failed.' }
          } elseif ('${{ github.event_name }}' -eq 'push' -and '${{ github.event.head_commit.message }}'.StartsWith('release:')) {
            throw 'Cannot publish Neon 2.2.7 without Assets/Solaris-Neon-UI.zip.'
          } else {
            Write-Warning 'Artwork ZIP is not in the repository yet. This development build uses the legacy backdrop; do not distribute it as 2.2.7.'
          }

      - name: Restore launcher
        run: dotnet restore SolarisLauncher.csproj

      - name: Build launcher
        run: dotnet build SolarisLauncher.csproj -c Release --no-restore

      - name: Publish launcher
        shell: pwsh
        run: |
          if (Test-Path artifacts) { Remove-Item artifacts -Recurse -Force }
          New-Item -ItemType Directory -Path artifacts/publish | Out-Null
          dotnet publish SolarisLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 -p:FileVersion=${{ steps.version.outputs.version }}.0 -o artifacts/publish
          if (-not (Test-Path artifacts/publish/SolarisLauncher.exe)) { throw 'SolarisLauncher.exe was not produced.' }

      - name: Create launcher ZIP
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          Compress-Archive -Path artifacts/publish/SolarisLauncher.exe -DestinationPath "artifacts/SolarisLauncher-$tag-win-x64.zip" -Force

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          Get-FileHash artifacts/publish/SolarisLauncher.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  SolarisLauncher.exe" } | Set-Content artifacts/SHA256SUMS.txt

      - name: Upload current branch build
        if: github.ref_type == 'branch' && github.ref_name == 'solaris-2.2-dev'
        uses: actions/upload-artifact@v4
        with:
          name: SolarisLauncher-${{ steps.version.outputs.tag }}-win-x64
          path: |
            artifacts/publish/SolarisLauncher.exe
            artifacts/SolarisLauncher-${{ steps.version.outputs.tag }}-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # A release: commit publishes the verified EXE to a durable GitHub
      # prerelease. Subsequent versions update in place through this channel.
      # Unlike Actions artifacts, GitHub Releases do not expire in 14 days.
      - name: Publish Solaris Neon update
        if: github.event_name == 'push' && github.ref_name == 'solaris-2.2-dev' && startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "neon-v$version"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Solaris Neon $tag is already published. Increase <Version> before releasing."
          }
          gh release create $tag "artifacts/publish/SolarisLauncher.exe" "artifacts/SolarisLauncher-v$version-win-x64.zip" "artifacts/SHA256SUMS.txt" --target "$env:GITHUB_SHA" --title "Solaris Neon $version" --notes "Solaris Neon $version — official Windows EXE, persistent launcher icon, in-place updates, and SHA256 verification." --prerelease

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release create $tag artifacts/publish/SolarisLauncher.exe "artifacts/SolarisLauncher-$tag-win-x64.zip" artifacts/SHA256SUMS.txt --title "Solaris Launcher $tag" --generate-notes

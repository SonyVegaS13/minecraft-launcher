name: Solaris Launcher Release

on:
  push:
    branches:
      - 'solaris-2.2-dev'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v2.1.3'
        required: true
        type: string

permissions:
  contents: write

# Prevent intermediate development commits from publishing over a later build.
concurrency:
  group: solaris-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } else {
            [xml]$project = Get-Content SolarisLauncher.csproj
            $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
            if ($null -eq $versionNode) { throw 'Project version is missing.' }
            $tag = "v$($versionNode.InnerText)"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Version must look like v1.0.0'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Install image support for approved Solaris icon
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate official Windows icon and launcher logo
        run: python scripts/generate_icon.py

      - name: Prepare and SHA256-verify bundled Solaris Neon artwork
        run: python scripts/prepare_neon_art.py

      - name: Prepare approved server card banners
        run: python scripts/prepare_card_art.py

      - name: Require user-approved server card banners for Solaris Neon release
        if: github.event_name == 'push' && github.ref_name == 'solaris-2.2-dev' && startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        run: |
          foreach ($name in @('SolarisVanillaCard', 'SolarisModdedCard')) {
            if (-not (Test-Path "Assets/$name.png")) {
              throw "Refusing to release Solaris Neon without approved $name artwork"
            }
          }

      - name: Restore launcher
        run: dotnet restore SolarisLauncher.csproj

      - name: Build launcher
        run: dotnet build SolarisLauncher.csproj -c Release --no-restore

      - name: Publish launcher
        shell: pwsh
        run: |
          if (Test-Path artifacts) { Remove-Item artifacts -Recurse -Force }
          New-Item -ItemType Directory -Path artifacts/publish | Out-Null
          # Each continuous DEV build gets a monotonically increasing Windows
          # file revision. The installed EXE can then distinguish updates even
          # while the product version stays at 2.2.10.
          $revision = '0'
          if ($env:GITHUB_REF -eq 'refs/heads/solaris-2.2-dev' -and $env:GITHUB_EVENT_NAME -eq 'push') {
            $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            if (-not ($event.head_commit.message -like 'release:*')) {
              $revision = $env:GITHUB_RUN_NUMBER
            }
          }
          $version = '${{ steps.version.outputs.version }}'
          $publishArgs = @('publish', 'SolarisLauncher.csproj', '-c', 'Release', '-r', 'win-x64',
              '--self-contained', 'true', '-p:PublishSingleFile=true',
              '-p:PublishTrimmed=false', "-p:Version=$version",
              "-p:AssemblyVersion=$version.0", "-p:FileVersion=$version.$revision",
              '-o', 'artifacts/publish')
          # Mark only automatic DEV builds so opening the EXE directly is safe:
          # it installs its own DEV copy instead of touching Solaris stable.
          if ($revision -ne '0') {
            $publishArgs += '-p:SolarisChannel=dev'
          }
          & dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          if (-not (Test-Path artifacts/publish/SolarisLauncher.exe)) { throw 'SolarisLauncher.exe was not produced.' }

      - name: Create launcher ZIP
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          Compress-Archive -Path artifacts/publish/SolarisLauncher.exe -DestinationPath "artifacts/SolarisLauncher-$tag-win-x64.zip" -Force

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          Get-FileHash artifacts/publish/SolarisLauncher.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  SolarisLauncher.exe" } | Set-Content artifacts/SHA256SUMS.txt

      - name: Upload current branch build
        if: github.ref_type == 'branch' && github.ref_name == 'solaris-2.2-dev'
        uses: actions/upload-artifact@v4
        with:
          name: SolarisLauncher-${{ steps.version.outputs.tag }}-win-x64
          path: |
            artifacts/publish/SolarisLauncher.exe
            artifacts/SolarisLauncher-${{ steps.version.outputs.tag }}-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # Continuous opt-in DEV updates. Public assets are durable (unlike the
      # 14-day Actions artifacts). Every successful development build has its
      # own tag/revision; the DEV updater checks this channel independently.
      # Official Solaris 2.2.9 never sees these tags or executables.
      - name: Publish continuous Solaris DEV update
        if: github.event_name == 'push' && github.ref_name == 'solaris-2.2-dev' && !startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $revision = $env:GITHUB_RUN_NUMBER
          $tag = "neon-dev-v$version.$revision"
          gh release create $tag "artifacts/publish/SolarisLauncher.exe" "artifacts/SHA256SUMS.txt" --target "$env:GITHUB_SHA" --title "Solaris Neon DEV $version.$revision" --notes "Continuous DEV update, isolated from stable. Install with --dev-channel. SHA256 verified, safe backup and rollback." --prerelease

      # A release: commit publishes the verified EXE to a durable GitHub
      # prerelease. Subsequent versions update in place through this channel.
      # Unlike Actions artifacts, GitHub Releases do not expire in 14 days.
      - name: Publish Solaris Neon update
        if: github.event_name == 'push' && github.ref_name == 'solaris-2.2-dev' && startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "neon-v$version"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Solaris Neon $tag is already published. Increase <Version> before releasing."
          }
          gh release create $tag "artifacts/publish/SolarisLauncher.exe" "artifacts/SolarisLauncher-v$version-win-x64.zip" "artifacts/SHA256SUMS.txt" --target "$env:GITHUB_SHA" --title "Solaris Neon $version" --notes "Solaris Neon $version — official Windows EXE, persistent launcher icon, in-place updates, and SHA256 verification." --prerelease

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release create $tag artifacts/publish/SolarisLauncher.exe "artifacts/SolarisLauncher-$tag-win-x64.zip" artifacts/SHA256SUMS.txt --title "Solaris Launcher $tag" --generate-notes

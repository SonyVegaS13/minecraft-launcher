name: Solaris ID integration and launcher build

on:
  workflow_dispatch:
  push:
    branches: [feature/solaris-id]
  pull_request:
    branches: [solaris-2.2-dev]
    paths:
      - 'backend/**'
      - 'bridges/**'
      - 'SolarisCloud*.cs'
      - 'SolarisId*.cs'
      - 'SolarisControlPanel.cs'
      - 'SolarisPlaytime.cs'
      - 'SolarisSkinPreview.cs'
      - 'MainWindow.xaml*'
      - 'tests/SolarisId*/**'
      - '.github/workflows/solaris-id-ci.yml'

permissions:
  contents: read

jobs:
  real-api-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare test dependencies
        run: |
          python -m pip install -r tests/SolarisId.Integration/requirements.txt
          dotnet tool install dotnet-ef --version 8.0.11 --tool-path "$RUNNER_TEMP/solaris-ef"
      - name: Preserve updater, Minecraft installation and release configuration
        run: python tests/SolarisId.Integration/check_preserved_systems.py
      - name: Real PostgreSQL, SMTP STARTTLS, HTTPS and security scenarios
        run: python tests/SolarisId.Integration/run_local.py --work-dir "$RUNNER_TEMP/solaris-id-validation" --ef "$RUNNER_TEMP/solaris-ef/dotnet-ef"
      - name: Launcher HTTP/session protocol tests
        run: dotnet run --project tests/SolarisIdClient.Tests/SolarisIdClient.Tests.csproj -c Release
      # No raw logs, mailbox, config, keys or binaries are uploaded. Test
      # credentials and confirmation/reset/token material must remain private.

  java-bridges:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Shared lifecycle and real TLS tests, Paper 1.20.1 build
        run: gradle -p bridges --no-daemon :core:test :paper:build
      - name: Forge 47.4.20 compilation, Mixins and reobfuscation
        run: gradle -p bridges/forge --no-daemon build --dependency-verification strict
      # Build validation only: never installs bridges or changes server/client packs.

  windows-compile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare existing approved icon resources
        run: |
          python -m pip install Pillow
          python scripts/generate_icon.py
          python scripts/prepare_neon_art.py
          python scripts/prepare_card_art.py
      - name: Restore and compile existing WPF launcher
        run: |
          dotnet restore SolarisLauncher.csproj
          dotnet build SolarisLauncher.csproj -c Release --no-restore
      - name: Validate Windows packaging without distribution
        run: dotnet publish SolarisLauncher.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/solaris-id-validation
      - name: Launcher protocol tests on Windows
        run: dotnet run --project tests/SolarisIdClient.Tests/SolarisIdClient.Tests.csproj -c Release
      # This feature workflow never creates tags, releases or updater manifests.

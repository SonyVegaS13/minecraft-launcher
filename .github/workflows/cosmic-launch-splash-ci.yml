name: Cosmic Minecraft launch splash CI

on:
  push:
    branches:
      - feature/cosmic-minecraft-launch-splash
  pull_request:
    branches:
      - solaris-2.2-dev

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install artwork helpers
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Prepare approved launcher assets
        run: |
          python scripts/generate_icon.py
          python scripts/prepare_neon_art.py
          python scripts/prepare_card_art.py
      - name: Restore
        run: dotnet restore SolarisLauncher.csproj
      - name: Compile (no release publishing)
        run: dotnet build SolarisLauncher.csproj -c Release --no-restore

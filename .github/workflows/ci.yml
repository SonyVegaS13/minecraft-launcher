name: Solaris Launcher CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SolarisLauncher.csproj

      - name: Build
        run: dotnet build SolarisLauncher.csproj -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish SolarisLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -o artifacts/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarisLauncher-ci
          path: artifacts/publish/SolarisLauncher.exe
          if-no-files-found: error

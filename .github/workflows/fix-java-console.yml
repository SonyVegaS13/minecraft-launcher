name: One-time Java console fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hide Minecraft Java console window
        shell: python
        run: |
          from pathlib import Path
          path = Path("MainWindow.xaml.cs")
          text = path.read_text(encoding="utf-8")
          marker = "process.StartInfo.CreateNoWindow = true;"
          if marker in text:
              print("Java console fix already applied.")
              raise SystemExit(0)
          old = "process.Start();"
          new = "process.StartInfo.UseShellExecute = false;\n            process.StartInfo.CreateNoWindow = true;\n            process.StartInfo.WindowStyle = ProcessWindowStyle.Hidden;\n            process.Start();"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected exactly 2 process.Start() calls, found {count}.")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml.cs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Hide Java console window when launching Minecraft"
          git push

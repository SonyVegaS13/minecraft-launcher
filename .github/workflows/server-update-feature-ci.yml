name: Solaris Server Update Flow — Validation

on:
  push:
    branches:
      - 'feature/per-server-update-buttons'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate Solaris icon
        run: python -m pip install --disable-pip-version-check Pillow && python scripts/generate_icon.py
        shell: bash
      - name: Prepare embedded Neon art
        run: |
          python scripts/prepare_neon_art.py
          python scripts/prepare_card_art.py
      - name: Restore launcher
        run: dotnet restore SolarisLauncher.csproj
      - name: Build launcher
        run: dotnet build SolarisLauncher.csproj -c Release --no-restore
      - name: Publish test EXE without creating a release
        run: >
          dotnet publish SolarisLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:SolarisChannel=dev
          -o artifacts/test
      - name: Upload test artifact only
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-update-flow-preview
          path: artifacts/test/SolarisLauncher.exe
          if-no-files-found: error
          retention-days: 7
